; Add to ARKO_PROJECT/Config/DefaultEngine.ini (already added there).
; Unreal services WebSockets at 30 Hz by default, which makes a 30 Hz pose stream from the relay queue up (latency grows to seconds).
[WebSockets.LibWebSockets]
ThreadTargetFrameTimeInSeconds=0.002

; Add to ARKO_PROJECT/Config/DefaultGame.ini, or set in Project Settings > Plugins > Phone Twin > Relay.
; Quote the URL: an unquoted // starts a comment in Unreal .ini files.
[/Script/PhoneTwinLink.PhoneTwinSettings]
RelayUrl="wss://YOUR-APP.ondigitalocean.app"
RelayRoom=arko
RelayKey=

; Add to ARKO_PROJECT/Config/DefaultEngine.ini (already added there).
; The smoke animation replaces the point cloud ~12 times a second: upload each one whole, or parts of it go missing.
[/Script/LidarPointCloudRuntime.LidarPointCloudSettings]
bUseRenderDataSmoothing=False

; Add to ARKO_PROJECT/Config/DefaultGame.ini (already added there): the Windows package.
; The immersive look material is saved by the editor command PhoneTwin.SaveMaterial into /Game/PhoneTwinRuntime,
; which is always cooked. Scans (PhoneTwinScans) are copied next to the package by tools/package_unreal.ps1.
[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Shipping
+DirectoriesToAlwaysCook=(Path="/Game/PhoneTwinRuntime")
+MapsToCook=(FilePath="/Game/FirstPerson/Maps/FirstPersonMap")
bUseIoStore=True
bShareMaterialShaderCode=True
IncludePrerequisites=True
