; Add to ARKO_PROJECT/Config/DefaultEngine.ini (already added there).
; Unreal services WebSockets at 30 Hz by default, which makes a 30 Hz pose stream from the relay queue up (latency grows to seconds).
[WebSockets.LibWebSockets]
ThreadTargetFrameTimeInSeconds=0.002

; Add to ARKO_PROJECT/Config/DefaultGame.ini, or set in Project Settings > Plugins > Phone Twin > Relay.
; Quote the URL: an unquoted // starts a comment in Unreal .ini files.
[/Script/PhoneTwinLink.PhoneTwinSettings]
RelayUrl="wss://YOUR-APP.ondigitalocean.app"
RelayRoom=arko
RelayKey=
