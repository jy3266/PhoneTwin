# After the phone uploads a scan: clone it into web_scans/ for the web viewer. scans/ itself is never changed.
name: Web scan copies

on:
  push:
    branches: [main]
    paths: ['scans/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/make_web_copies.mjs HEAD
      - name: Commit the clones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_scans
          git diff --cached --quiet || git commit -m "Clone new scans for the web viewer"
          git pull --rebase origin main
          git push
