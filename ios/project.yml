# XcodeGen spec: `xcodegen generate` in this folder creates PhoneTwin.xcodeproj (done by .github/workflows/ios.yml on a macOS runner).
name: PhoneTwin
options:
  bundleIdPrefix: studio.junoh
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: ""
targets:
  PhoneTwin:
    type: application
    platform: iOS
    sources: [PhoneTwin]
    info:
      path: PhoneTwin/Info.plist
      properties:
        CFBundleDisplayName: Phone Twin v4
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 휴대폰 위치 추적(ARKit)과 공간 스캔에 카메라가 필요합니다.
        NSLocalNetworkUsageDescription: 같은 Wi-Fi의 언리얼 PC와 ESP32 손목 장치로 위치·진동 신호(UDP)를 주고받습니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.junoh.phonetwin.v4
        PRODUCT_NAME: PhoneTwin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  PhoneTwinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhoneTwinTests]
    dependencies:
      - target: PhoneTwin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.junoh.phonetwin.v4.tests
schemes:
  PhoneTwin:
    build:
      targets:
        PhoneTwin: all
        PhoneTwinTests: [test]
    test:
      targets: [PhoneTwinTests]
